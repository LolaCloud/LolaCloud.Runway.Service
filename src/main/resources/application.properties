spring.application.name=runway
server.port=8083

# PostgreSQL Data Source
spring.datasource.url=jdbc:postgresql://localhost:5433/lola_runway
spring.datasource.username=lola
spring.datasource.password=lola
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Lola Platform Configuration
lola.lci.auth.introspect-url=http://localhost:8080/internal/v1/auth/introspect
lola.cloudflare.api.base-url=https://api.cloudflare.com/client/v4
lola.runway.sync.interval-ms=600000
lola.runway.ddns.interval-ms=600000

